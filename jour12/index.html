<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oclock - Minuteur, Chronomètre, Horloge & Réveil</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>⏰ Oclock</h1>
        </header>

        <main>
            <!-- Horloge -->
            <section class="card">
                <h2>🕐 Horloge</h2>
                <div class="clock-display" id="clock">00:00:00</div>
            </section>

            <!-- Minuteur -->
            <section class="card">
                <h2>⏱️ Minuteur</h2>
                <div class="timer-controls">
                    <div class="time-input">
                        <input type="number" id="timer-hours" placeholder="HH" min="0" max="23">
                        <span>:</span>
                        <input type="number" id="timer-minutes" placeholder="MM" min="0" max="59">
                        <span>:</span>
                        <input type="number" id="timer-seconds" placeholder="SS" min="0" max="59">
                    </div>
                    <div class="arrow-controls">
                        <button class="arrow-btn" data-action="increase">▲</button>
                        <button class="arrow-btn" data-action="decrease">▼</button>
                    </div>
                </div>
                <div class="timer-display" id="timer-display">00:00:00</div>
                <div class="timer-buttons">
                    <button class="btn-primary" id="timer-btn">Démarrer</button>
                    <button class="btn-secondary" id="timer-reset-btn">Réinitialiser</button>
                </div>
            </section>

            <!-- Chronomètre -->
            <section class="card">
                <h2>⏲️ Chronomètre</h2>
                <div class="stopwatch-display" id="stopwatch-display">00:00:00</div>
                <div class="stopwatch-controls">
                    <button class="btn-primary" id="stopwatch-btn">Démarrer</button>
                    <button class="btn-secondary" id="lap-btn">Tour</button>
                    <button class="btn-secondary" id="reset-btn">Reset</button>
                </div>
                <ul class="laps-list" id="laps-list"></ul>
            </section>

            <!-- Réveil -->
            <section class="card">
                <h2>⏰ Réveil</h2>
                <div class="alarm-form">
                    <input type="time" id="alarm-time" required>
                    <input type="text" id="alarm-message" placeholder="Message de l'alarme">
                    <button class="btn-primary" id="add-alarm-btn">Ajouter alarme</button>
                </div>
                <ul class="alarms-list" id="alarms-list"></ul>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
