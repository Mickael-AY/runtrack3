<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Jour 05</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Jour 05</h1>
        <nav>
            <a href="inscription.html" class="btn">Inscription</a>
            <a href="connexion.html" class="btn active">Connexion</a>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h2>Connexion</h2>

            <form id="loginForm" novalidate autocomplete="off">
                <!-- Protection CSRF (simulée côté front) -->
                <input type="hidden" name="csrf_token" id="csrf_token">

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="exemple@domaine.fr" autocomplete="email"
                        required aria-describedby="email-error">
                    <span class="error-message" id="email-error" role="alert"></span>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Votre mot de passe"
                            autocomplete="current-password" required aria-describedby="password-error">
                        <button type="button" class="toggle-password" aria-label="Afficher le mot de passe">
                            👁️
                        </button>
                    </div>
                    <span class="error-message" id="password-error" role="alert"></span>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">Se connecter</span>
                    <span class="btn-loader"></span>
                </button>
            </form>

            <p class="form-footer">
                Pas encore de compte ? <a href="inscription.html">S'inscrire</a>
            </p>
        </div>
    </main>

    <script src="validation.js"></script>
    <script src="connexion.js"></script>
</body>

</html>
